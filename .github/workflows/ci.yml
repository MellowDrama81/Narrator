name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore required workloads
        run: dotnet workload restore Mellow.Narrator.slnx

      - name: Restore packages
        run: dotnet restore Mellow.Narrator.slnx --locked-mode

      - name: Build Android target
        if: github.event_name != 'push' || github.ref != 'refs/heads/master'
        run: dotnet build Mellow.Narrator.Gui/Mellow.Narrator.Gui.csproj --framework net10.0-android --configuration Release --no-restore

      - name: Publish Android APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: dotnet publish Mellow.Narrator.Gui/Mellow.Narrator.Gui.csproj --framework net10.0-android --configuration Release --no-restore -p:AndroidPackageFormats=apk

      - name: Restore Windows runtime pack
        run: dotnet restore Mellow.Narrator.Gui/Mellow.Narrator.Gui.csproj --runtime win-x64 --no-dependencies --force-evaluate --lock-file-path obj/ci-runtime-packages.lock.json -p:TargetFrameworks=net10.0-windows10.0.19041.0

      - name: Build Windows target
        run: dotnet build Mellow.Narrator.Gui/Mellow.Narrator.Gui.csproj --framework net10.0-windows10.0.19041.0 --runtime win-x64 --configuration Release --no-restore

      - name: Build CLI
        run: dotnet build Mellow.Narrator.Cli/Mellow.Narrator.Cli.csproj --configuration Release --no-restore

      - name: Run Core, provider, and persistence tests
        run: dotnet test Mellow.Narrator.Tests/Mellow.Narrator.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn

      - name: Upload Android APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v7
        with:
          name: Mellow-Narrator-Android-${{ github.sha }}
          path: Mellow.Narrator.Gui/bin/Release/net10.0-android/publish/*-Signed.apk
          if-no-files-found: error
          retention-days: 30
