name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore required workloads
        run: dotnet workload restore Mellow.Narrator.slnx

      - name: Restore packages
        run: dotnet restore Mellow.Narrator.slnx --locked-mode

      - name: Build Blazor Hybrid Android target
        run: dotnet build Mellow.Narrator/Mellow.Narrator.csproj --framework net10.0-android --configuration Release --no-restore

      - name: Restore Blazor Hybrid Windows runtime pack
        run: dotnet restore Mellow.Narrator/Mellow.Narrator.csproj --runtime win-x64 --no-dependencies --force-evaluate --lock-file-path obj/ci-runtime-packages.lock.json -p:TargetFrameworks=net10.0-windows10.0.19041.0

      - name: Build Blazor Hybrid Windows target
        run: dotnet build Mellow.Narrator/Mellow.Narrator.csproj --framework net10.0-windows10.0.19041.0 --runtime win-x64 --configuration Release --no-restore

      - name: Run Core, provider, and persistence tests
        run: dotnet test Mellow.Narrator.Tests/Mellow.Narrator.Tests.csproj --configuration Release --no-restore --collect:"XPlat Code Coverage"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: "**/TestResults/**/coverage.cobertura.xml"
          if-no-files-found: warn
