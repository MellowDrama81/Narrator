name: Deploy web app to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/pages.yml"
      - "Mellow.Narrator.Web/**"
      - "Mellow.Narrator.Core/Generated/PromptTemplates.g.cs"
      - "prompts/**"
      - "tools/Mellow.Narrator.PromptGenerator/**"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Install Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate

      - name: Install web dependencies
        working-directory: Mellow.Narrator.Web
        run: pnpm install --frozen-lockfile

      - name: Build GitHub Pages artifact
        working-directory: Mellow.Narrator.Web
        run: pnpm run build:github-pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: Mellow.Narrator.Web/dist/github-pages
          include-hidden-files: true

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
